# Nixpacks configuration for automated tax rulings scraper
# This tells Coolify/Nixpacks how to build and run the application

[phases.setup]
# Only add the system packages Chrome/Chromium needs. Leave nixPkgs alone so
# Nixpacks' own Python provider still generates the /opt/venv + pip install
# steps (a custom [phases.install] here would replace that venv creation,
# leaving python3 without pip - see "No module named pip" build failures).
aptPkgs = [
  "chromium",
  "chromium-driver",
  "wget",
  "gnupg",
  "ca-certificates",
  "curl"
]

[start]
# Keep container running for scheduled tasks
# Coolify will execute the actual scraper via scheduled tasks
cmd = "tail -f /dev/null"

[variables]
# Set environment variables for Python
PYTHONUNBUFFERED = "1"
